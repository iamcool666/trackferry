# 备选：不能用 host 网络时，改用端口映射。一般不需要它。
#
#   docker compose -f compose.bridge.yaml up -d
#
# 桥接容器连本机的飞牛音乐常被 NAS 防火墙挡住，relay 用来绕开，它不对外开端口。
name: trackferry

services:
  trackferry:
    # 其余设置与 compose.yaml 相同，先在那里改好
    extends: { file: compose.yaml, service: trackferry }
    network_mode: !reset null
    ports:
      - "18561:18561"
      # 电视端连接端口，和 compose.yaml 里的 TRACKFERRY_TV_LISTEN 一致。从 1.6.0 升级时要补上这一行。
      # 桥接网络下电视收不到局域网广播，自动发现找不到 NAS：在电视连接页选“手动连接”，填 NAS 地址
      - "18562:18562"
    volumes:
      - relay:/run/trackferry

  relay:
    image: madrays/trackferry:latest
    container_name: trackferry-relay
    command: ["relay"]
    depends_on: [trackferry]
    restart: unless-stopped
    network_mode: host
    environment:
      # 飞牛的 HTTPS 端口，改过才需要动
      TRACKFERRY_RELAY_TARGET: "127.0.0.1:5667"
      # 主服务设了 PUID、PGID 时，这里要一样，才能共用通道
      # PUID: "1000"
      # PGID: "1001"
    volumes:
      - relay:/run/trackferry
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    healthcheck: { disable: true }
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

volumes:
  relay:
