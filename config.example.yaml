# 可选的配置文件，放在 data/config.yaml。
# 用 compose.yaml 里的环境变量就够了；两边都写时，环境变量优先。

# 监听地址
listen: ":18561"

# 音箱取歌用的局域网地址（TRACKFERRY_URL）
public_base_url: "http://192.168.1.10:18561"

# 电视端连接端口，"off" 关闭电视端（TRACKFERRY_TV_LISTEN）
tv_listen: ":18562"

# 允许设为接管的音箱，写名字的一部分，"*" 为全部（TRACKFERRY_TAKEOVER）
takeover_speakers: ["*"]

# 去 GitHub 看有没有新版本（TRACKFERRY_UPDATE_CHECK）
update_check: true

# 投放到局域网里的 DLNA 和 Chromecast 设备（TRACKFERRY_CAST）
cast: true

# 无损转 MP3 用的 ffmpeg，空着用 PATH 里的（TRACKFERRY_FFMPEG）；默认镜像里没有，要用 :ffmpeg 镜像
# ffmpeg: /usr/bin/ffmpeg
# 转好的 MP3 最多占多少 MB（TRACKFERRY_MP3_CACHE_MB）
mp3_cache_mb: 2048

# 容器内的目录，一般不用改
data_dir: /data
music_dir: /music  # 只读挂载的音乐文件夹（TRACKFERRY_MUSIC_DIR），连了飞牛音乐时不读
