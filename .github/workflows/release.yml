name: release

# Every code push updates the single rolling dev Release and the :dev image.
on:
  push:
    branches:
      - feature/trackferry-plus
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: write

concurrency:
  group: trackferry-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go packages
        run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-
      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        run: gh --version
      - name: Keep only one rolling dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Remove old prerelease records, but keep their numeric git tags so
          # the next formal version continues increasing from the highest tag.
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" ]] && continue
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true and .tagName != "dev") | .tagName')

          # Recreate the fixed dev tag at this exact commit and keep one dev Release.
          if gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            git push origin :refs/tags/dev 2>/dev/null || true
          fi
          gh release create dev --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TrackFerry Dev" \
            --prerelease \
            --notes "滚动开发版。\n\nCommit: $GITHUB_SHA\n\nDocker: `ghcr.io/$GITHUB_REPOSITORY:dev`"
