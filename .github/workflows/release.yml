name: release

# Every code push updates the single rolling dev Release and the :dev image.
on:
  push:
    branches:
      - feature/trackferry-plus

permissions:
  contents: write

concurrency:
  group: trackferry-dev
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Go packages
        run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha,format=short,prefix=dev-
      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=dev
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep only one rolling dev Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # Remove old prerelease records but retain their numeric git tags.
          # This preserves the next formal version number.
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" ]] && continue
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes
          done < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true and .tagName != "dev") | .tagName')

          # Move the fixed dev tag to this commit, then recreate its Release.
          if gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete dev --repo "$GITHUB_REPOSITORY" --yes
          fi
          git push origin --delete dev 2>/dev/null || true
          git tag -f dev "$GITHUB_SHA"
          git push origin refs/tags/dev
          gh release create dev --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TrackFerry Dev" \
            --prerelease \
            --notes "Rolling development build. Commit: $GITHUB_SHA. Docker image: ghcr.io/$GITHUB_REPOSITORY:dev"
