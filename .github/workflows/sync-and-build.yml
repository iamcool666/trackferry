name: sync-and-build

# Manual upstream sync. Merge into a review branch and open a PR; never replace this branch.
on:
  workflow_dispatch:

concurrency:
  group: trackferry-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: workroom2008/trackferry
  UPSTREAM_BRANCH: feature/trackferry-plus
  TARGET_BRANCH: feature/trackferry-plus

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
      - name: Merge upstream without overwriting our work
        id: merge
        run: |
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${TARGET_BRANCH}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already contains upstream."
            exit 0
          fi
          branch="sync/upstream-${GITHUB_RUN_ID}"
          git checkout -b "$branch" "origin/${TARGET_BRANCH}"
          if ! git merge --no-edit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
            echo "::error::Upstream merge has conflicts. Nothing was pushed; resolve them manually."
            git status --short
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Push review branch and open PR
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "HEAD:refs/heads/${{ steps.merge.outputs.branch }}"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --head "${{ steps.merge.outputs.branch }}" \
            --base "${TARGET_BRANCH}" \
            --title "Sync upstream ${UPSTREAM_REPO}/${UPSTREAM_BRANCH}" \
            --body "Manual upstream sync. This PR uses a normal merge and preserves fork commits. Review conflicts and changes before merging."
      - name: Summary
        if: always()
        run: |
          {
            echo "## Manual upstream sync"
            echo "- Upstream: ${UPSTREAM_REPO}/${UPSTREAM_BRANCH}"
            echo "- Target: ${TARGET_BRANCH}"
            echo "- No scheduled or push-triggered sync"
            echo "- Changes are proposed as a PR; this workflow never force-pushes the target branch"
          } >> "$GITHUB_STEP_SUMMARY"
