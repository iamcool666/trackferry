# TrackFerry 部署文件。改好标着【改】的地方，然后执行：
#
#   docker compose up -d
#   docker compose logs trackferry                    # 最后一段是首次登录用的初始化码
#   docker exec trackferry /trackferry setup-code     # 只看初始化码
#
# 逐步说明和常见问题：docs/deployment.md　全部配置项：docs/configuration.md
name: trackferry

services:
  trackferry:
    # 音箱放不了无损、要用“无损转 MP3”时改成 madrays/trackferry:ffmpeg（带 ffmpeg，不能在设置页一键更新）
    image: madrays/trackferry:latest
    container_name: trackferry
    restart: unless-stopped

    # 直接使用 NAS 的网络：连本机的飞牛音乐最省事，也不用映射端口。
    # NAS 开着防火墙时，要放行给局域网：18561/TCP（音箱取歌、网页），
    # 用电视端还要放行 18562/TCP（电视连接）和 5353/UDP（电视自动找到 NAS）；投放到 DLNA 还要放行 1900/UDP。
    network_mode: host

    environment:
      TZ: Asia/Shanghai
      # 【改】这台 NAS 的局域网地址。音箱从这里取歌，不能写 127.0.0.1 或 localhost
      TRACKFERRY_URL: "http://192.168.1.10:18561"
      # 监听端口。被占用时换一个，上面地址里的端口要一起改
      TRACKFERRY_LISTEN: ":18561"
      # 电视端连接端口（加密，和上面不是同一个）。被占用时换一个；不用电视就改成 "off"，
      # 同时关掉局域网广播。从 1.6.0 及更早升级时，把这一行补进自己的 compose 文件
      TRACKFERRY_TV_LISTEN: ":18562"
      # 允许设为“接管”的音箱：* 是全部；也可以写名字的一部分，逗号分隔，如 "书房,客厅"
      # 这里只是放行，要不要接管在管理页里逐台选
      TRACKFERRY_TAKEOVER: "*"
      # 投放到局域网里的 DLNA 和 Chromecast 设备（在“更多 → 电视和投放”里打开）。不用就改成 "off"
      TRACKFERRY_CAST: "on"
      # 每天去 GitHub 看有没有新版本，不会自己安装。不需要就改成 "off"
      TRACKFERRY_UPDATE_CHECK: "on"
      # 程序用哪个普通身份运行，data 会在启动时自动改成它的。一般不用改；
      # 想让 NAS 上的某个用户能看 data，就填那个用户 id -u 和 id -g 的结果
      # PUID: "1000"
      # PGID: "1001"

    volumes:
      # 数据库、登录凭据和设置都在这里。升级、重建容器都不会丢，备份也只需要备份它
      - ./data:/data
      # 可选：不用飞牛音乐时，只读挂载音乐文件夹当曲库（连了飞牛就以飞牛为准，这里不读）。
      # 去掉下一行开头的 # 并改成你的路径，末尾的 :ro 别删；有几个文件夹就挂到 /music 下的不同名字，
      # 比如 /vol2/1000/Live:/music/现场:ro。读标签、内嵌封面、同目录的 cover.jpg 和 .lrc 歌词，
      # 挂好后在“设置 → 音乐文件夹”看扫描结果
      # - /vol1/1000/Music:/music:ro
      # 可选：听过的线上歌放到别的盘（比如机械盘），不写就放在 data/cache。
      # 只用它里面的 trackferry 文件夹，别的内容不动
      # - /vol2/1000/Cache:/cache

    # 安全限制，保持不动：容器内文件只读、不允许提升权限。
    # 下面四项特权只在启动的一瞬间用：把 data 交给普通身份，再切换成它。之后程序不是 root，也没有任何特权
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]

    # 停止时留出时间，把音箱音量恢复好
    stop_grace_period: 20s
    # 日志最多占 30 MB
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
